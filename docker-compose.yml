services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diabetes_risk}
      POSTGRES_USER: ${POSTGRES_USER:-diabetes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diabetes}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diabetes} -d ${POSTGRES_DB:-diabetes_risk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trainer:
    build:
      context: .
      dockerfile: docker/trainer.Dockerfile
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    profiles:
      - train

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://diabetes:diabetes@db:5432/diabetes_risk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501,http://localhost:8510}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_URL: ${API_URL:-http://api:8000}
    ports:
      - "${UI_PORT:-8501}:8501"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
