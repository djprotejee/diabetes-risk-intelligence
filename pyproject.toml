[project]
name = "diabetes-risk-intelligence"
version = "0.1.0"
description = "Production-style PoC for diabetes risk prediction with ensemble ML, FastAPI, Streamlit, Docker, and PostgreSQL."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

