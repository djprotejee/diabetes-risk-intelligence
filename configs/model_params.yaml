logistic_regression:
  C: 1.0
  class_weight: balanced
  max_iter: 3000
  solver: lbfgs

random_forest:
  n_estimators: 350
  max_depth: 14
  min_samples_leaf: 8
  class_weight: balanced_subsample
  random_state: 42
  n_jobs: -1

extra_trees:
  n_estimators: 450
  max_depth: 16
  min_samples_leaf: 8
  class_weight: balanced
  random_state: 42
  n_jobs: -1

hist_gradient_boosting:
  max_iter: 260
  learning_rate: 0.045
  max_leaf_nodes: 31
  l2_regularization: 0.15
  random_state: 42

lightgbm:
  n_estimators: 450
  learning_rate: 0.035
  num_leaves: 42
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.0
  class_weight: balanced
  random_state: 42
  n_jobs: -1
  verbosity: -1

xgboost:
  n_estimators: 360
  learning_rate: 0.035
  max_depth: 4
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 1.2
  objective: binary:logistic
  eval_metric: logloss
  random_state: 42
  n_jobs: -1

